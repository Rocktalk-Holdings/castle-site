<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0A0A0B; }
    .mark { fill: #F0EDE8; }
    .accent { fill: #4A7FA5; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #F0EDE8; }
      .mark { fill: #0A0A0B; }
      .accent { fill: #4A7FA5; }
    }
  </style>
  <!-- Background -->
  <rect class="bg" width="32" height="32"/>
  <!-- C letterform — two horizontal bars + vertical stem -->
  <rect class="mark" x="10" y="9" width="12" height="2.5"/>
  <rect class="mark" x="10" y="20.5" width="12" height="2.5"/>
  <rect class="mark" x="10" y="9" width="2.5" height="14"/>
  <!-- Accent bar bottom — steel blue underline -->
  <rect class="accent" x="10" y="27" width="12" height="2"/>
</svg>
