<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1a17; }
      .tower { fill: #b5821a; }
      .battlements { fill: #b5821a; }
      .flag { fill: #f5f2ed; }
    }
  </style>
  <!-- bg circle -->
  <circle class="bg" cx="16" cy="16" r="16" fill="#1c1a17"/>
  <!-- tower body -->
  <rect class="tower" x="9" y="14" width="14" height="13" fill="#b5821a"/>
  <!-- battlements -->
  <rect class="battlements" x="9" y="11" width="3" height="4" fill="#b5821a"/>
  <rect class="battlements" x="14" y="11" width="3" height="4" fill="#b5821a"/>
  <rect class="battlements" x="19" y="11" width="3" height="4" fill="#b5821a"/>
  <!-- gate -->
  <rect x="13" y="20" width="6" height="7" rx="1" fill="#1c1a17"/>
  <!-- flag pole -->
  <line x1="16" y1="4" x2="16" y2="11" stroke="#f5f2ed" stroke-width="1"/>
  <!-- flag -->
  <polygon class="flag" points="16,5 21,7.5 16,10" fill="#f5f2ed"/>
</svg>
